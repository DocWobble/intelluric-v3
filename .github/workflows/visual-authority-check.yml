name: Visual Authority Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build canonical reference
        run: npm run build
      - name: Enforce singular visual authority
        run: npm run check
      - name: Upload canonical reference build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-reference
          path: apps/canonical-reference/dist
          if-no-files-found: error
