name: Visual Authority Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build parametric style prototype
        run: npm run build
      - name: Enforce parametric visual authority
        run: npm run check
      - name: Upload style prototype build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parametric-style-prototype
          path: apps/canonical-reference/dist
          if-no-files-found: error
