name: Design Contract Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build canonical public homepage
        run: npm run public:build
      - name: Run repository acceptance checks
        run: npm run check
      - name: Upload canonical homepage build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-public-homepage
          path: apps/public-site/dist
          if-no-files-found: error
