name: Design Contract Check

on:
  pull_request:
  push:
    branches: [main, repair/design-contract-boundaries]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate token outputs
        run: npm run tokens:build
      - name: Commit generated outputs on repair branch
        if: github.event_name == 'push' && github.ref_name == 'repair/design-contract-boundaries'
        run: |
          if git diff --quiet -- packages/design-tokens/dist; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/design-tokens/dist
          git commit -m "Regenerate design token outputs"
          git push origin HEAD:repair/design-contract-boundaries
      - run: npm run check
